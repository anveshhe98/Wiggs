version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - FLASK_SECRET=${FLASK_SECRET}
      - PORT=5000
    volumes:
      - ./tg_sessions:/app/tg_sessions
      - ./logs:/app/logs
    restart: unless-stopped

  bot:
    build: .
    command: python bot_upgraded.py
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - FLASK_SECRET=${FLASK_SECRET}
    volumes:
      - ./tg_sessions:/app/tg_sessions
      - ./logs:/app/logs
    restart: unless-stopped
    depends_on:
      - web

volumes:
  tg_sessions:
  logs:
